<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#ffb6d1;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;width:88%;max-width:340px;padding:35px 22px;border-radius:30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.18);position:absolute}
#toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:25px;font-size:14px;display:none;z-index:9999}
.btn{border:none;padding:12px 28px;border-radius:16px;font-size:20px;font-weight:bold;cursor:pointer}
#yesBtn{background:#fff;border:3px solid #ff2e7e;min-width:100px;box-shadow:0 0 0 4px #ffb6d1;transition:all 0.5s ease}
#noBtn{background:transparent;margin-top:20px;font-size:24px;position:relative;transition:all 0.3s ease}
.shareBtn{background:#25D366;color:#fff;padding:14px;width:100%;border-radius:30px;border:none;font-size:16px;font-weight:bold;margin-top:12px}
.playBtn{background:#ff2e7e;color:#fff;padding:14px;width:100%;border-radius:30px;border:none;font-size:16px;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div id="toast"></div>

<div class="card" id="readyPage" style="z-index:10">
<div style="font-size:55px">💖✨</div>
<h1>Surprise For You</h1>
<p>Tap ready for a challenge 😏</p>
<button class="btn" style="background:#ff2e7e;color:#fff;margin-top:10px;width:100%;padding:16px" onclick="startGame()">I'm Ready! 👇</button>
</div>

<div class="card" id="mainPage" style="display:none;z-index:5">
<div style="font-size:50px">💖✨</div>
<h1>Do you love me?</h1>
<p><b>Alert 🚨</b><br>Tap yes before your phone explode 💣💥</p>
<div style="height:180px;margin-top:15px">
<button class="btn" id="yesBtn" onclick="yesClicked()">YES</button><br><br>
<button class="btn" id="noBtn" onclick="noClicked()" ontouchstart="noClicked()">NO 🙈</button>
</div>
</div>

<div class="card" id="finalPage" style="display:none;z-index:20">
<div style="font-size:60px">😍💋</div>
<h1>I knew it! 😏❤️</h1>
<h2 style="font-size:19px">Now you are officially mine! 😙💗</h2>
<button class="shareBtn" onclick="shareLink()">Share to friends 🔗</button>
<button class="playBtn" onclick="location.reload()">Play Again 🔁</button>
</div>

<script>
let yesSize=100, noAttempts=0;
const msgs=["Nice try! 😂","Nope, try again! 😜","Are you sure? 🥺","Please say yes 🥹","Hehe you can't! 😂","Oye YES dabao na! 🙈"];
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',1200)}
function startGame(){document.getElementById('readyPage').style.display='none';document.getElementById('mainPage').style.display='block';}
function noClicked(){noAttempts++;yesSize+=22;let y=document.getElementById('yesBtn');y.style.minWidth=yesSize+'px';y.style.background='#ff2e7e';y.style.color='#fff';y.style.fontSize=(20+noAttempts*1.2)+'px';let n=document.getElementById('noBtn');let x=Math.random()*120-Math.random()*120;let yy=Math.random()*70-Math.random()*70;n.style.transform=`translate(${x}px,${yy}px)`;showToast(msgs[noAttempts%msgs.length]);}
function yesClicked(){document.getElementById('mainPage').style.display='none';document.getElementById('finalPage').style.display='block';}
function shareLink(){let url="https://tashevero22-svg.github.io/Surprise4You/";if(navigator.share){navigator.share({title:"Do you love me?",text:"Try this 😂",url:url})}else{navigator.clipboard.writeText(url);alert("Link Copied! 💚\n"+url)}}
</script>
</body>
</html>
