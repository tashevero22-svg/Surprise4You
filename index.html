<title>Do you love me?</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#ffb6d1;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.card{background:#fff;width:88%;max-width:340px;padding:35px 22px;border-radius:30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.18)}
h1{font-size:26px;margin:10px 0}
#toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:25px;font-size:14px;display:none;z-index:9999;animation:pop 0.3s}
@keyframes pop{0%{transform:translateX(-50%) scale(0.5)}100%{transform:translateX(-50%) scale(1)}}
.btn{border:none;padding:12px 28px;border-radius:16px;font-size:20px;font-weight:bold;cursor:pointer;transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)}
#yesBtn{background:#fff;border:3px solid #ff2e7e;color:#000;min-width:100px;box-shadow:0 0 0 4px #ffb6d1;transition:all 0.5s ease}
#noBtn{background:transparent;margin-top:20px;font-size:24px;position:relative;left:0;top:0;transition:all 0.3s ease}
#final{display:none}
.shareBtn{background:#25D366;color:#fff;padding:14px;width:100%;border-radius:30px;border:none;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
.playBtn{background:#ff2e7e;color:#fff;padding:14px;width:100%;border-radius:30px;border:none;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
</style>
</head>
<body>

<div id="toast"></div>

</div>
