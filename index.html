<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Do you love me?</title>
<style>
body{margin:0;background:#ffb6d1;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;width:90%;max-width:330px;padding:30px 20px;border-radius:28px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.2)}
h1{font-size:26px}
.btn{border:none;border-radius:15px;font-weight:bold;cursor:pointer}
.big{width:100%;padding:18px;font-size:20px;background:#ff2e7e;color:#fff;margin-top:15px}
#yes{border:3px solid #ff2e7e;padding:12px 30px;font-size:22px;background:#fff;min-width:110px;transition:all .5s ease}
#no{background:none;font-size:24px;margin-top:20px;position:relative;transition:all .3s ease}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:999;font-size:14px}
</style>
</head>
<body>
<div id="toast"></div>
<div class="box" id="app">
<div style="font-size:55px">💖✨</div>
<h1>Surprise For You</h1>
<p>Tap ready for a challenge 😏</p>
<button class="btn big" id="readyBtn">I'm Ready! 👇</button>
</div>

<script>
let yesW=110, tries=0;
let msgs=["Nice try! 😂","Nope, try again! 😜","Are you sure? 🥺","Please say yes 🥹","Hehe you can't! 😂","Oye YES dabao na! 🙈"];

function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',1200)}

document.getElementById('readyBtn').addEventListener('click', showMain);
document.getElementById('readyBtn').addEventListener('touchstart', showMain);

function showMain(){
document.getElementById('app').innerHTML=`
<div style="font-size:50px">💖✨</div>
<h1>Do you love me?</h1>
<p><b>Alert 🚨</b><br>Tap yes before your phone explode 💣💥</p>
<div style="height:170px;margin-top:20px">
<button class="btn" id="yes">YES</button><br><br>
<button class="btn" id="no">NO 🙈</button>
</div>`;
setTimeout(()=>{
document.getElementById('yes').onclick=yesClick;
document.getElementById('no').onclick=noClick;
document.getElementById('no').ontouchstart=noClick;
},100);
}

function noClick(){
tries++;
yesW+=25;
let y=document.getElementById('yes');
y.style.minWidth=yesW+'px';
y.style.background='#ff2e7e';
y.style.color='#fff';
y.style.fontSize=(22+tries)+'px';
let n=document.getElementById('no');
n.style.transform=`translate(${Math.random()*100-50}px, ${Math.random()*60-30}px)`;
toast(msgs[tries%msgs.length]);
}

function yesClick(){
document.getElementById('app').innerHTML=`
<div style="font-size:65px">😍💋</div>
<h1>I knew it! 😏❤️</h1>
<h2 style="font-size:19px">Now you are officially mine! 😙💗</h2>
<button class="btn big" style="background:#25D366" onclick="share()">Share to your friends and see if they love you 🔗</button>
<button class="btn big" style="background:#ff2e7e;margin-top:10px" onclick="location.reload()">Play Again 🔁</button>
`;
}

function share(){
let url="https://tashevero22-svg.github.io/Surprise4You/";
if(navigator.share){navigator.share({title:"Do you love me?",url:url})}
else{navigator.clipboard.writeText(url);alert("Link Copied! "+url)}
}
</script>
</body>
</html>
