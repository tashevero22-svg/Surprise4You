<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Do You Love me?</title><style>body{margin:0;background:#f8a4c0;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}.box{background:#fff;width:88%;max-width:360px;padding:30px 22px;border-radius:32px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.18);min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.ready-title{color:#e91e63;font-size:21px;font-weight:600}.ready-sub{color:#888;margin:8px 0 25px}.ready-btn{background:#e91e63;color:#fff;border:none;width:100%;padding:18px;border-radius:30px;font-size:20px;font-weight:bold}.sticker{width:130px;height:130px;object-fit:cover;margin:0 auto;border-radius:16px}.btn-row{position:relative;width:100%;height:340px;margin-top:10px}.btn{border:1.5px solid #ddd;padding:11px 28px;border-radius:26px;background:#fff;font-size:18px;position:absolute;z-index:999;display:block;opacity:1}#noBtn{left:56%;top:62%}#yesBtn{left:14%;top:62%}</style></head><body><div class="box" id="box"><div id="app"><p class="ready-title">Are you ready? 😉</p><p class="ready-sub">I have a question...</p><button class="ready-btn" onclick="goStep1()">I'm Ready! 🫣</button></div></div><script>let step=1,imgs=[];fetch("https://api.github.com/repos/tashevero22-svg/Surprise4You/contents").then(r=>r.json()).then(d=>{imgs=d.filter(x=>x.name.match(/\.jpe?g/i)).map(x=>x.name);});function goStep1(){let i1=imgs[0]||"";document.getElementById('app').innerHTML=`<img class="sticker" id="st" src="${encodeURI(i1)}"><h2>Do You Love me?</h2><p id="sub" style="min-height:20px"></p><div class="btn-row"><button class="btn" id="yesBtn">YES</button><button class="btn" id="noBtn">NO 🙈</button></div>`;setTimeout(()=>{step=1;document.getElementById('yesBtn').onclick=final;document.getElementById('noBtn').onclick=noClick;},150);}function noClick(){let s=document.getElementById('st'),t=document.getElementById('sub'),n=document.getElementById('noBtn');if(step==1){step=2;s.src=encodeURI(imgs[1]||imgs[0]);t.innerText="Wait don't click too fast 😣";}else if(step==2){step=3;s.src=encodeURI(imgs[2]||imgs[0]);t.innerText="Are you sure? Let's see 😊";n.onmouseenter=fly;n.onmouseover=fly;n.ontouchstart=(e)=>{e.preventDefault();fly();};}else{fly();}}function fly(){let n=document.getElementById('noBtn');let maxX=260;let maxY=260;let x=10+Math.random()*maxX;let y=80+Math.random()*maxY;n.style.left=x+"px";n.style.top=y+"px";n.style.display="block";n.style.opacity="1";}function final(){let s=imgs[2]||imgs[0];document.getElementById('app').innerHTML=`<img class="sticker" src="${encodeURI(s)}"><p style="font-size:22px;font-weight:800;margin:10px 0 0">I KNEW IT 😏💗</p><p>Now you are officially mine</p><button style="background:#22c55e;color:#fff;border:none;width:100%;padding:16px;border-radius:18px;font-size:18px;font-weight:600;margin-top:15px" onclick="navigator.clipboard.writeText('https://tashevero22-svg.github.io/Surprise4You/');alert('Link Copied!')">Share 🔗</button><button style="background:#e91e63;color:#fff;border:none;width:100%;padding:14px;border-radius:18px;font-size:18px;font-weight:600;margin-top:10px" onclick="location.reload()">Play Again 🔁</button>`;}</script></body></html>
