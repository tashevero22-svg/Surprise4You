<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Do You Love me?</title><style>body{margin:0;background:#f8a4c0;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}.box{background:#fff;width:88%;max-width:360px;padding:35px 22px;border-radius:32px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.18);min-height:460px;display:flex;flex-direction:column;justify-content:center}.ready-title{color:#e91e63;font-size:21px;margin:0;font-weight:600}.ready-sub{color:#888;margin:8px 0 25px}.ready-btn{background:#e91e63;color:#fff;border:none;width:100%;padding:18px;border-radius:30px;font-size:20px;font-weight:bold;cursor:pointer}.sticker-img{width:170px;height:170px;object-fit:contain;margin:0 auto}h2{font-size:23px;margin:14px 0 6px}.sub{font-size:15px;min-height:22px;margin-bottom:18px}.btn-row{display:flex;justify-content:center;gap:20px;position:relative;height:120px;margin-top:12px}.btn{border:1.5px solid #d0d0d0;padding:10px 28px;border-radius:26px;background:#fff;font-size:18px}#noBtn{position:absolute;left:55%}#yesBtn{position:absolute;left:15%}.final-title{font-size:22px;font-weight:800;margin:0}.share-btn{background:#22c55e;color:#fff;border:none;width:100%;padding:16px;border-radius:18px;font-size:18px;font-weight:600;margin-top:25px}.play-btn{background:#e91e63;color:#fff;border:none;width:100%;padding:14px;border-radius:18px;font-size:18px;font-weight:600;margin-top:12px}</style></head><body><div class="box" id="app"><p class="ready-title">Are you ready? 😉</p><p class="ready-sub">I have a question...</p><button class="ready-btn" onclick="goStep1()">I'm Ready! 🫣</button></div><script>let images=["221aac824dbd2876f2f655ead8dd7472 (1).jpg","IMG-20260829-WA0167(1).jpg","WA_1788012798314.jpeg"];let subs=["","Wait don't click too fast 😣","Are you sure you don't Love me? Let's see 😊"];let step=1;function goStep1(){document.getElementById('app').innerHTML=`<img class="sticker-img" id="stImg" src="${images[0]}"><h2>Do You Love me?</h2><p class="sub" id="subText"></p><div class="btn-row"><button class="btn" id="yesBtn">YES</button><button class="btn" id="noBtn">NO 🙈</button></div>`;setTimeout(()=>{step=1;document.getElementById('yesBtn').onclick=showFinal;document.getElementById('noBtn').onclick=handleNo;},100);}function handleNo(){let s=document.getElementById('stImg'),t=document.getElementById('subText'),n=document.getElementById('noBtn');if(step==1){step=2;s.src=images[1];t.innerText=subs[1];}else if(step==2){step=3;s.src=images[2];t.innerText=subs[2];n.onmouseover=runAway;n.ontouchstart=(e)=>{e.preventDefault();runAway();};}else runAway();}function runAway(){let n=document.getElementById('noBtn'),x=Math.random()*240-120,y=Math.random()*200-80;n.style.left='50%';n.style.top='50%';n.style.transform=`translate(calc(-50% + ${x}px), ${y}px)`;n.style.opacity='0';setTimeout(()=>n.style.opacity='1',130);}function showFinal(){document.getElementById('app').innerHTML=`<div style="flex:1;display:flex;flex-direction:column;justify-content:center"><p class="final-title">I KNEW IT 😏💗</p><p>Now you are officially mine</p><p style="font-size:22px">😍💗</p></div><div><button class="share-btn" onclick="share()">Share with friends 🔗</button><button class="play-btn" onclick="location.reload()">Play Again 🔁</button></div>`;}function share(){let u="https://tashevero22-svg.github.io/Surprise4You/";if(navigator.share)navigator.share({title:"Do you love me?",url:u});else{navigator.clipboard.writeText(u);alert("Link Copied! "+u)}}</script></body></html>
