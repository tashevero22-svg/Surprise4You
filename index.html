<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I KNEW IT!</title>
<style>
body{background:linear-gradient(135deg,#ffe6f0,#ffccde);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Comic Sans MS',cursive;margin:0;padding:15px}
.card{background:white;padding:28px 22px;border-radius:30px;max-width:380px;width:100%;box-shadow:0 15px 35px rgba(0,0,0,.15);text-align:center}
h1{color:#ff2a6d;font-size:24px}
.bold-only{font-size:34px;font-weight:900;color:#ff0055;margin:15px 0;letter-spacing:1px}
p{color:#555;font-size:18px;line-height:1.5}
.btn{border:none;padding:14px 30px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin:10px;min-width:120px;transition:0.3s}
.yes{background:linear-gradient(90deg,#ff2a6d,#ff7aa2);color:white}
.no{background:#f0f0f0;color:#555}
#timer{font-weight:bold;color:#ff2a6d}
#warning{color:red;font-weight:bold;display:none;animation:shake 0.3s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#result{display:none}
.gif{width:150px;border-radius:20px;margin:auto;display:block}
</style>
</head>
<body>
<div class="card" id="main">
<img class="gif" src="https://media.tenor.com/2uyENRuvV-0AAAAi/cute.gif">
<h1>Hey! Quick Question... 😳<br>Do you like me? 🥺</h1>
<div id="timer">💣 Phone explodes in: <span id="count">15</span>s</div>
<div id="warning">⚠️ TAP YES BEFORE IT EXPLODES! 💥</div>
<div style="margin-top:20px">
<button class="btn yes" id="yesBtn" onclick="yesClick()">YES! 💘</button>
<button class="btn no" id="noBtn" onclick="noClick()">No 😒</button>
</div>
</div>

<div class="card" id="result">
<img class="gif" src="https://media.giphy.com/media/l0HlNaQ6gWfllcjDO/giphy.gif">
<div class="bold-only">I KNEW IT! 😍💖</div>
<p>
Now you are officially mine! 🥰💑<br>
No return, No exchange! 😜💋🔒
</p>
<p style="font-size:32px">💘✨</p>
</div>

<script>
const YOUR_NUMBER = "917005375447";
let timeLeft = 15; let yesSize = 1;
let noTexts = ["No 😒","Sure? 🤔","It will blast! 💣","Tap YES! 🥺"];
const timer = setInterval(()=>{
timeLeft--; document.getElementById('count').innerText = timeLeft;
yesSize+=0.12; document.getElementById('yesBtn').style.transform=`scale(${yesSize})`;
if(timeLeft<=8) document.getElementById('warning').style.display='block';
if(timeLeft<=0){clearInterval(timer); document.getElementById('main').innerHTML=`<h1>💥 BOOM!</h1><p>Now you HAVE to say YES!</p><button class="btn yes" style="transform:scale(2.2)" onclick="yesClick()">OKAY YES! 💘</button>`;}
},1000);
function noClick(){let b=document.getElementById('noBtn');b.style.position='absolute';b.style.left=Math.random()*65+'%';b.style.top=Math.random()*70+'%';}
function yesClick(){clearInterval(timer);document.getElementById('main').style.display='none';document.getElementById('result').style.display='block';
let msg=`😍 I KNEW IT! She said YES! 🎉%0ALink: ${window.location.href}`; setTimeout(()=>{window.open(`https://wa.me/${YOUR_NUMBER}?text=${msg}`,'_blank');},800);}
</script>
</body>
</html>
